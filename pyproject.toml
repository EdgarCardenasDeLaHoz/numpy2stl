[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "numpy2stl"
version = "0.2.0"
description = "Convert NumPy arrays and geometry into STL/OBJ/3MF meshes for 3D printing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Edgar Cardenas De La Hoz" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "shapely>=2.0",
    "scipy>=1.9",
    "triangle>=20200424",
]

[project.optional-dependencies]
tools = ["opencv-python>=4.5", "scikit-image>=0.19"]
boolean = ["pymeshlab>=2022.2", "manifold3d>=2.4"]
geo = ["rasterio>=1.3", "h5py>=3.7"]
mesh = ["trimesh>=3.9"]
registration = [
    "matplotlib>=3.5",   # registration reports
    "osmnx>=2.0",
    "geopandas>=1.0",
    "rasterio>=1.3",
    "opencv-python>=4.5",
    "scikit-image>=0.19",
]
viz = ["matplotlib>=3.5", "napari[all]>=0.4"]
dev = ["pytest>=8", "pytest-benchmark>=4", "ruff>=0.4"]
all = ["numpy2stl[tools,boolean,geo,mesh,registration]"]

[project.urls]
Repository = "https://github.com/EdgarCardenasDeLaHoz/numpy2stl"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"numpy2stl.registration" = ["templates/*.css", "docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not integration and not slow"]
markers = [
    "slow: takes more than a few seconds",
    "integration: full pipeline tests / live network calls",
    "requires_scipy: needs scipy installed",
    "requires_opencv: needs opencv-python installed",
]

# Same rules as strm2stl/ruff.toml, so both repos enforce one standard.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length: handled by the formatter, not the linter
    "B008",  # function calls in argument defaults
    "B006",  # mutable default arguments
    "UP007", # keep Optional[] where it reads more clearly
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]  # fixture overrides
# Operator scripts: correctness rules still apply, style-only rules do not.
"src/numpy2stl/registration/scripts/*" = ["E701", "E702", "E731", "E741", "UP031", "B904", "B905"]
