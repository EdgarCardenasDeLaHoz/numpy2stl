name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -p no:cacheprovider --junitxml=pytest-report.xml

      - name: Annotate test failures
        if: failure()
        shell: python
        run: |
          import pathlib, xml.etree.ElementTree as ET
          for p in pathlib.Path(".").rglob("pytest-report.xml"):
              for case in ET.parse(p).iter("testcase"):
                  for bad in list(case.iter("failure")) + list(case.iter("error")):
                      msg = " ".join((bad.get("message") or "").split())[:900]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{msg}")
